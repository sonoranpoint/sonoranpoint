<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light only"><title>You're invited to Sonoran Point</title></head>
<body style="margin:0;padding:0;background:#eef2f7">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#eef2f7">
  <tr><td align="center" style="padding:32px 12px">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:520px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #dde3ec">
      <tr><td style="padding:0"><table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0"><tr><td width="30%" height="4" style="height:4px;line-height:4px;font-size:0;background:#f7931e">&nbsp;</td><td height="4" style="height:4px;line-height:4px;font-size:0;background:#1e6fd9">&nbsp;</td></tr></table></td></tr>
      <tr><td align="center" style="padding:30px 32px 6px">
        <img src="https://app.sonoranpoint.com/brand/logo.png" width="240" alt="Sonoran Point Technologies" style="display:block;width:240px;max-width:80%;height:auto;border:0">
      </td></tr>
      <tr><td style="padding:18px 36px 4px;font-family:Arial,Helvetica,sans-serif;color:#0b2a5b">
        <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;font-weight:bold">You're invited to Sonoran Point</h1>
        <p style="margin:0;font-size:15px;line-height:1.6;color:#33415c">Tap the button to set up your account.</p>
      </td></tr>
      <tr><td align="center" style="padding:26px 36px 8px">
        <table role="presentation" cellspacing="0" cellpadding="0" border="0"><tr>
          <td align="center" bgcolor="#1557b0" style="border-radius:10px">
            <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:14px 30px;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:10px">Accept invite</a>
          </td></tr></table>
      </td></tr>
      <tr><td style="padding:14px 36px 26px;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.6;color:#5d6b82">
        This link works once.
      </td></tr>
      <tr><td style="padding:16px 36px 22px;border-top:1px solid #e6ebf2;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#8a96a8">
        Sent to {{ .Email }}. If you weren't expecting this, you can ignore it.<br>
        Sonoran Point Technologies · Equipment tracking · <a href="mailto:support@sonoranpoint.com" style="color:#1557b0;text-decoration:none">support@sonoranpoint.com</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body></html>
