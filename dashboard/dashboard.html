<title>Equipment Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Saira:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a left rail of sections (top bar on phones) beside one working view; details open in a side panel.
   Same type and brand family as the station so the product reads as one thing. */
:root {
  --bg: #f2f4f7;
  --surface: #ffffff;
  --surface-2: #f6f8fa;
  --ink: #121a24;
  --muted: #5a6777;
  --line: #dce2e9;
  --brand: #1f4e79;          /* fills: buttons, rail */
  --brand-ink: #ffffff;
  --brand-text: #1f4e79;     /* brand-colored text and links */
  --brand-soft: #e7eef6;
  --accent: #f2a900;
  --ok: #1b7343;   --ok-bg: #e2f3e9;
  --warn: #8f5400; --warn-bg: #fcefd8;
  --bad: #b3261e;  --bad-bg: #fbe5e3;
  --info: #1f5f9e; --info-bg: #e3eef9;
  --focus: #2b6cb0;
  --shadow: 0 10px 30px -12px rgba(16, 28, 45, .28);
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1319; --surface: #151c24; --surface-2: #1a222c; --ink: #e5eaf0; --muted: #94a1b1; --line: #29333e;
    --brand: #2c6699; --brand-ink: #ffffff; --brand-text: #8cbcee; --brand-soft: #18293a; --accent: #f2b42a;
    --ok: #63d39a; --ok-bg: #12301f; --warn: #f2bb55; --warn-bg: #33270e; --bad: #ff8f86; --bad-bg: #3b1614; --info: #8cc2f5; --info-bg: #13283d;
    --focus: #8cbcee; --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1319; --surface: #151c24; --surface-2: #1a222c; --ink: #e5eaf0; --muted: #94a1b1; --line: #29333e;
  --brand: #2c6699; --brand-ink: #ffffff; --brand-text: #8cbcee; --brand-soft: #18293a; --accent: #f2b42a;
  --ok: #63d39a; --ok-bg: #12301f; --warn: #f2bb55; --warn-bg: #33270e; --bad: #ff8f86; --bad-bg: #3b1614; --info: #8cc2f5; --info-bg: #13283d;
  --focus: #8cbcee; --shadow: 0 10px 30px -12px rgba(0, 0, 0, .6);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.45; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--brand); color: var(--brand-ink); padding: 18px 14px; display: flex; flex-direction: column; gap: 18px;
        position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; }
.org { display: flex; align-items: center; gap: 10px; padding: 4px 6px; }
.logo { width: 40px; height: 40px; border-radius: 9px; background: var(--accent); color: #1a1a1a; display: grid; place-items: center;
        font-family: var(--display); font-weight: 700; font-size: 19px; flex: none; }
.org b { font-family: var(--display); font-size: 21px; font-weight: 700; line-height: 1.05; display: block; }
.org small { opacity: .8; font-size: 12px; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { color: inherit; text-decoration: none; display: flex; align-items: center; justify-content: space-between; gap: 8px;
         padding: 9px 12px; border-radius: 9px; font-weight: 700; font-size: 15px; opacity: .86; }
.nav a:hover { background: rgba(255, 255, 255, .1); opacity: 1; }
.nav a.on { background: rgba(255, 255, 255, .17); opacity: 1; }
.nav .n { background: #fff; color: var(--bad); border-radius: 99px; font-size: 12px; padding: 1px 8px; font-weight: 700; }
.nav .n.quiet { background: rgba(255,255,255,.22); color: inherit; }
.powered { display: flex; align-items: center; gap: 8px; padding: 10px 8px 0; color: inherit; text-decoration: none; font-size: 11.5px; letter-spacing: .02em; opacity: .78; }
.powered:hover { opacity: 1; }
.powered img { width: 22px; height: 22px; flex: none; }
.powered b { font-weight: 700; display: block; font-size: 12.5px; letter-spacing: 0; }
.me-foot { display: none; justify-content: center; align-items: center; flex-wrap: wrap; gap: 6px 10px; padding-top: 28px; color: var(--muted); font-size: 13.5px; }
.powered-foot { display: none; color: var(--muted); justify-content: center; padding: 24px 0 4px; opacity: 1; }
.me { margin-top: auto; font-size: 13px; padding: 10px 8px; border-top: 1px solid rgba(255, 255, 255, .18); display: flex; flex-direction: column; gap: 2px; }
.me b { font-size: 14px; }
.demo-pill { align-self: flex-start; background: var(--accent); color: #1a1a1a; border-radius: 99px; padding: 1px 9px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }

.main { padding-block: 26px 48px; padding-left: max(28px, env(safe-area-inset-left, 0px)); padding-right: max(28px, env(safe-area-inset-right, 0px)); min-width: 0; }
.wrap { max-width: 1240px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 20px; }
.head h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 38px; line-height: 1; letter-spacing: .005em; }
.head p { margin: 4px 0 0; color: var(--muted); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: sticky; top: env(safe-area-inset-top, 0px); height: auto; z-index: 5; flex-direction: row; align-items: center; gap: 10px;
          padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .org small, .me, .rail .powered { display: none; }
  .powered-foot, .me-foot { display: flex; }
  .org b { font-size: 18px; } .logo { width: 34px; height: 34px; font-size: 16px; }
  .nav { flex-direction: row; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { white-space: nowrap; padding: 7px 10px; font-size: 14px; }
  .main { padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .head h1 { font-size: 32px; }
}

/* Building blocks */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); }
.panel-h h2 { margin: 0; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.panel-b { padding: 14px 18px; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1080px) { .grid2 { grid-template-columns: minmax(0, 1fr); } }

.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1080px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } .kpis > :last-child { grid-column: 1 / -1; } .org b { display: none; } }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; text-align: left; display: flex; flex-direction: column; gap: 2px; position: relative; overflow: hidden; }
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.kpi.bad::before { background: var(--bad); } .kpi.warn::before { background: var(--warn); } .kpi.ok::before { background: var(--ok); }
.kpi:hover { border-color: var(--muted); }
.kpi b { font-family: var(--display); font-size: 40px; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi span { font-weight: 700; font-size: 14px; }
.kpi small { color: var(--muted); font-size: 12.5px; }

.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 99px; white-space: nowrap; letter-spacing: .02em; }
.chip.ok { background: var(--ok-bg); color: var(--ok); } .chip.warn { background: var(--warn-bg); color: var(--warn); }
.chip.bad { background: var(--bad-bg); color: var(--bad); } .chip.info { background: var(--info-bg); color: var(--info); }
.chip.quiet { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.chip.brand { background: var(--brand-soft); color: var(--brand-text); }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 13px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 4px 10px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: default; }
.link { background: none; border: 0; padding: 0; color: var(--brand-text); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; }

.filters { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
.field { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 7px 11px; min-width: 0; }
input.field { width: 260px; max-width: 100%; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; background: var(--surface); flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; font-weight: 700; font-size: 13.5px; color: var(--muted); }
.seg button.on { background: var(--brand-soft); color: var(--brand-text); }
.seg button + button { border-left: 1px solid var(--line); }

.tablewrap { overflow-x: auto; }
@media (max-width: 900px) { .tablewrap table { min-width: 760px; } .tablewrap td { white-space: nowrap; } }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface-2); }
td { padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; } tbody tr.click:hover td { background: var(--surface-2); }
td .sub { display: block; color: var(--muted); font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.late { color: var(--bad); font-weight: 700; }
.muted { color: var(--muted); }
.empty { padding: 26px 18px; color: var(--muted); text-align: center; }

.list { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 18px; border-bottom: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.row:last-child { border-bottom: 0; }
button.row:hover { background: var(--surface-2); }
.row b { font-weight: 700; } .row .sub { display: block; color: var(--muted); font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--muted); }
.dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); } .dot.ok { background: var(--ok); } .dot.info { background: var(--info); }

.feed .row { grid-template-columns: 92px minmax(0, 1fr); padding: 9px 18px; }
.feed time { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }

/* Side panel */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 22, .42); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(540px, 100%); background: var(--surface); z-index: 21; box-shadow: var(--shadow);
          display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.drawer-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 22px 14px; border-bottom: 1px solid var(--line); }
.drawer-h h2 { margin: 0; font-family: var(--display); font-size: 32px; line-height: 1; }
.drawer-h p { margin: 6px 0 0; color: var(--muted); }
.drawer-b { padding: 16px 22px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }
.sect h3 { margin: 0 0 8px; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.inline-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.inline-form .field { flex: 1; min-width: 160px; }
.confirm { background: var(--bad-bg); color: var(--bad); border-radius: 10px; padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-weight: 700; font-size: 14px; }
.notice { background: var(--info-bg); color: var(--info); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.hist { display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--line); margin-left: 5px; }
.hist div { position: relative; padding: 3px 0 10px 16px; font-size: 14px; }
.hist div::before { content: ""; position: absolute; left: -6px; top: 8px; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--brand-text); }
.hist div.in::before { border-color: var(--ok); } .hist div.flag::before { border-color: var(--warn); background: var(--warn); }
.hist time { color: var(--muted); font-size: 12.5px; display: block; }

.codebox { font-family: var(--mono); font-size: 34px; font-weight: 600; letter-spacing: .12em; background: var(--surface-2); border: 1px dashed var(--muted); border-radius: 12px; padding: 14px 18px; text-align: center; }

.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { margin: 0; font-family: var(--display); font-size: 25px; line-height: 1.05; }

.form-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 12px 16px; align-items: center; }
@media (max-width: 640px) { .form-grid { grid-template-columns: minmax(0, 1fr); gap: 6px; } }
.form-grid label { font-weight: 700; font-size: 14px; } .form-grid label small { display: block; font-weight: 400; color: var(--muted); font-size: 12.5px; }
.switch { position: relative; width: 44px; height: 26px; display: inline-block; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .15s; }
.switch span::after { content: ""; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.switch input:checked + span { background: var(--ok); } .switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.logo-row { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
.logo-prev { width: 220px; height: 96px; border: 1px solid var(--line); border-radius: 12px; background: #1f4e79; display: grid; place-items: center; padding: 10px; position: relative; overflow: hidden; }
.logo-prev img { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); object-fit: contain; }
.logo-prev img.sp { inset: 18px; width: calc(100% - 36px); height: calc(100% - 36px); }
.logo-prev small { position: absolute; inset: auto 0 0 0; background: rgba(255, 255, 255, .92); color: #5a6a84; font-size: 11px; text-align: center; padding: 3px 4px; }
label.btn { cursor: pointer; } label.btn.disabled { opacity: .55; cursor: default; }
.swatch { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); display: inline-block; vertical-align: middle; }

.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
.fgrid .full { grid-column: 1 / -1; }
.fgrid label { display: flex; flex-direction: column; gap: 5px; font-weight: 700; font-size: 13.5px; min-width: 0; }
.fgrid label small { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.fgrid .field { width: 100%; }
@media (max-width: 560px) { .fgrid { grid-template-columns: minmax(0, 1fr); } }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-weight: 400; }
.checks label { flex-direction: row; align-items: center; gap: 6px; font-weight: 400; }
.err { color: var(--bad); font-weight: 700; font-size: 14px; min-height: 1em; }
.viewas { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
.viewas select { background: rgba(255,255,255,.14); color: inherit; border: 1px solid rgba(255,255,255,.3); border-radius: 7px; padding: 3px 6px; font-size: 13px; }
.viewas select option { color: #111; }
.readonly-note { background: var(--surface-2); border: 1px dashed var(--line); border-radius: 10px; padding: 9px 12px; color: var(--muted); font-size: 13.5px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
         padding: 10px 18px; border-radius: 10px; font-weight: 700; z-index: 40; box-shadow: var(--shadow); max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .drawer { animation: slide .18s ease-out; } @keyframes slide { from { transform: translateX(24px); opacity: .6; } } }
/* SP-THEME:start (generated from brand/sp-theme.css) */
/* =====================================================================
   Sonoran Point theme — "desert night" (shared by the dashboard and console)
   Night navy rail over a mountain ridge with a sunset glow; Sonoran blue for
   actions; sunset orange only where something needs attention.
   Display: Saira (echoes the wordmark). Text: Atkinson Hyperlegible.
   ===================================================================== */
:root {
  --sp-night: #071a36; --sp-night-2: #0b2350; --sp-blue: #1663d6; --sp-sky: #2f9bff; --sp-sun: #f7931e; --sp-sun-2: #ffb547;
  --bg: #f1f4f9; --surface: #ffffff; --surface-2: #f5f8fc; --ink: #0c1b33; --muted: #5a6a84; --line: #dee5ef;
  --brand: #1663d6; --brand-ink: #ffffff; --brand-text: #1556bd; --brand-soft: #e6effc; --accent: #f7931e;
  --ok: #157a46; --ok-bg: #e2f5ea; --warn: #9a5800; --warn-bg: #fff1dc; --bad: #c0331f; --bad-bg: #fde8e4; --info: #1556bd; --info-bg: #e6effc;
  --focus: #2f9bff; --shadow: 0 18px 40px -20px rgba(7, 26, 54, .35);
  --display: "Saira", "Eurostile", "Arial Narrow", sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --rail-ink: #e7efff; --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07111f; --surface: #0d1b31; --surface-2: #11223d; --ink: #e8effb; --muted: #94a6c4; --line: #1d3254;
    --brand: #2f86ff; --brand-ink: #ffffff; --brand-text: #8cc0ff; --brand-soft: #132b52; --accent: #ffa233;
    --ok: #5fd39a; --ok-bg: #0f2e22; --warn: #ffbd5c; --warn-bg: #33240c; --bad: #ff8b7a; --bad-bg: #3a1712; --info: #8cc0ff; --info-bg: #132b52;
    --focus: #8cc0ff; --shadow: 0 18px 40px -20px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07111f; --surface: #0d1b31; --surface-2: #11223d; --ink: #e8effb; --muted: #94a6c4; --line: #1d3254;
  --brand: #2f86ff; --brand-ink: #ffffff; --brand-text: #8cc0ff; --brand-soft: #132b52; --accent: #ffa233;
  --ok: #5fd39a; --ok-bg: #0f2e22; --warn: #ffbd5c; --warn-bg: #33240c; --bad: #ff8b7a; --bad-bg: #3a1712; --info: #8cc0ff; --info-bg: #132b52;
  --focus: #8cc0ff; --shadow: 0 18px 40px -20px rgba(0, 0, 0, .7); color-scheme: dark;
}
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); }

/* ---- The rail: night sky, ridge line, sunset glow ---- */
.rail {
  background:
    radial-gradient(90% 34% at 50% 104%, rgba(247, 147, 30, .42), rgba(247, 147, 30, .10) 45%, transparent 70%),
    linear-gradient(180deg, #0c2752 0%, var(--sp-night) 48%, #04112a 100%);

    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return { ok: false, error: "Enter a full email address." };
    if (!canManageRole(role)) return { ok: false, error: "Only an owner can add owners." };
    if (DB.members.some((m) => m.email === email)) return { ok: false, error: "That person is already on the team." };
    DB.invites = DB.invites.filter((i) => i.email !== email);
    DB.invites.unshift({ id: "i" + Date.now(), email, role, created: Date.now(), expires: Date.now() + 14 * 86400000 });
    return { ok: true };
  },
  setMemberRole(id, role) {
    const m = DB.members.find((x) => x.id === id);
    if (!canManageRole(m.role) || !canManageRole(role)) return { ok: false, error: "Only an owner can change owners." };
    if (m.role === "owner" && role !== "owner" && DB.members.filter((x) => x.role === "owner").length === 1) return { ok: false, error: "The company needs at least one owner. Make someone else an owner first." };
    m.role = role; if (m.id === DB.me.id) DB.me.role = role; return { ok: true };

    const m = DB.members.find((x) => x.id === id);

    if (m.role === "owner" && DB.members.filter((x) => x.role === "owner").length === 1) return { ok: false, error: "The company needs at least one owner." };

/* Same rule as private.build_shift_report: what the shift's crew had out at shift end + grace, and what happened next. */
function shiftReportItems(o, cutoff) {
  const crew = new Set(DB.employees.filter((e) => e.shifts.includes(o.s.id)).map((e) => e.id));
  const items = [];
  for (const q of DB.equipment) {
    const evs = DB.txns.filter((t) => t.eq === q.id);
    const last = evs.filter((t) => t.at <= cutoff).pop();
    if (!last || last.action !== "checkout" || !crew.has(last.emp)) continue;
    const nx = evs.find((t) => t.at > cutoff);
    const outcome = nx?.action === "checkin" ? "returned_late" : nx?.action === "checkout" && nx.emp !== last.emp ? "taken_by_other" : q.status === "lost" ? "lost" : "not_returned";
    items.push({ eq: q, emp: empOf(last.emp), out_at: last.at, outcome, next: nx, nextBy: nx ? empOf(nx.emp) : null });
  }
  return items;
}

function fmtWhen(ms) {
  if (!ms) return "";

  if (dayKey(d) === dayKey(t)) return fmtTime(ms);
  if (dayKey(d) === dayKey(addDays(t, -1))) return "Yesterday " + fmtTime(ms);
  return new Intl.DateTimeFormat("en-US", { timeZone: tz(), weekday: "short", month: "short", day: "numeric" }).format(new Date(ms)) + ", " + fmtTime(ms);
}

// Any picture becomes a PNG at most 1024 px on its longest side (transparency kept), so only small, safe PNGs are stored.
async function toPng(file) {
  if (!/^image\/(png|jpeg|svg\+xml|webp)$/.test(file.type)) throw new Error("Pick a PNG, JPG, SVG or WebP image.");
  if (file.size > 10e6) throw new Error("That image is over 10 MB.");
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error("That image couldn't be opened.")); i.src = url; });
    let w = img.naturalWidth || 1024, h = img.naturalHeight || 1024;
    const k = file.type === "image/svg+xml" ? 1024 / Math.max(w, h) : Math.min(1, 1024 / Math.max(w, h)); w = Math.round(w * k); h = Math.round(h * k);
    const c = document.createElement("canvas"); c.width = w; c.height = h; c.getContext("2d").drawImage(img, 0, 0, w, h);
    return await new Promise((ok, bad) => c.toBlob((b) => (b ? ok(b) : bad(new Error("That image couldn't be converted."))), "image/png"));
  } finally { URL.revokeObjectURL(url); }
}

async function uploadLogo(file) {
  const png = await toPng(file);

  const path = `${DB.org.id}/logo-${Date.now()}.png`;

  if (error) throw new Error(/row-level|not allowed|unauthor/i.test(error.message) ? "Only admins can change the logo." : error.message);
  return sb.storage.from("logos").getPublicUrl(path).data.publicUrl;
}

function agoShort(ms) { const m = (Date.now() - ms) / MIN; if (m < 1) return "now"; if (m < 60) return Math.round(m) + "m ago"; if (m < 48 * 60) return Math.round(m / 60) + "h ago"; return Math.round(m / 1440) + "d ago"; }
function feedRow(a) {

        ${r.inProgress ? `<span class="chip quiet">Live</span>` : r.outstanding ? `<span class="chip ${r.stillOut ? "bad" : "warn"}">${r.outstanding} not back${r.stillOut ? `, ${r.stillOut} still out` : ""}</span>` : `<span class="chip ok">All returned</span>`}
      </button>`).join("")}</div></section>`).join("");
}

const DOW = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
function daysText(days) {
  if (!days || days.length === 7) return "Every day";
  const k = [...days].sort().join();
  if (k === "1,2,3,4,5") return "Mon–Fri"; if (k === "6,7") return "Sat–Sun";
  return days.map((d) => DOW[d - 1]).join(", ");
}
function fmtClock(hhmm) { const [h, m] = hhmm.split(":").map(Number); return `${h % 12 || 12}:${String(m).padStart(2, "0")} ${h < 12 ? "AM" : "PM"}`; }

async function okRpc(fn, args) { const r = await rpc(fn, args); if (r && r.ok === false) throw new Error(r.error); return r; }

async function all(table, cols, build) {      // reads past the server's 1000-row page size

}

      invites: (team.invites || []).map((i) => ({ id: i.id, email: i.email, role: i.role, created: ms(i.created_at), expires: ms(i.expires_at) })),
      me: { id: L.user.id, name: L.names[L.user.id], role }, audit: [], reportAcks: {}, occs: [],
    });
    // Live previews for shifts still in progress (today's and last night's), like the demo.
    DB.previews = [];
    if ((DB.org.modules || []).includes("shifts")) {
      const today = localDay(Date.now(), tz()), yday = addDays(today, -1);
      const calls = DB.shifts.filter((s) => s.active).flatMap((s) => [today, yday].map((d) => rpc("shift_report", { p_shift: s.id, p_date: dayKey(d) }).then((r) => ({ r, s, d })).catch(() => null)));
      for (const x of await Promise.all(calls)) if (x?.r?.ok && x.r.in_progress && x.r.scheduled && ms(x.r.shift_start) <= Date.now()) DB.previews.push(x);
    }
    // The saved reports + previews in the shape the Shifts screens use.
    const item = (i) => ({ eq: { id: i.equipment_id, name: i.equipment }, emp: { name: i.employee }, out_at: ms(i.checked_out_at), outcome: i.outcome,
      next: i.resolved_at ? { at: ms(i.resolved_at) } : null, nextBy: i.resolved_by ? { name: i.resolved_by } : null });
    DB.liveReports = [
      ...DB.previews.map(({ r, s, d }) => ({ key: `live:${s.id}:${dayKey(d)}`, shift: s, day: d, start: ms(r.shift_start), end: ms(r.shift_end), cutoff: ms(r.cutoff), inProgress: true,
        items: r.items.map(item), outstanding: r.outstanding_count, stillOut: r.still_out_count, ack: null })),
      ...reports.map((r) => { const s = DB.shifts.find((x) => x.id === r.shift_id) || { id: r.shift_id, name: "Shift", grace: 15 };
        const [y, m, dd] = r.shift_date.split("-").map(Number);
        return { key: r.id, shift: s, day: { y, m, d: dd }, start: ms(r.shift_start), end: ms(r.shift_end), cutoff: ms(r.cutoff), inProgress: false, items: (r.items || []).map(item),
          outstanding: r.outstanding_count, stillOut: r.still_out_count,
          ack: r.acknowledged_at ? { by: who(r.acknowledged_by), at: ms(r.acknowledged_at), note: r.acknowledgement_notes } : null }; }),
    ].sort((a, b) => b.start - a.start);
  },
  async reload() {
    L.reloading = (L.reloading || 0) + 1;
    try { await live.load(); } catch (e) { return toast(niceErr(e)); } finally { L.reloading--; }
    if (S.drawer && DRAWERS[S.drawer.kind] && S.drawer.id && !["eqForm", "empForm", "shiftForm"].includes(S.drawer.kind)) {
      const gone = { equipment: () => !eqOf(S.drawer.id), employee: () => !empOf(S.drawer.id), station: () => !DB.stations.some((s) => s.id === S.drawer.id) }[S.drawer.kind];
      if (gone && gone()) S.drawer = null;
    }
    applyBrand(); keepTyping(render);
  },
};
// Re-draw without losing what someone is in the middle of typing (or where the cursor is).
const cssq = (v) => String(v).replace(/["\\]/g, "\\$&");
function keepTyping(draw) {
  const typed = [...document.querySelectorAll("form[data-form] input, form[data-form] select, form[data-form] textarea")]
    .filter((el) => el.name && (el.type === "checkbox" ? el.checked !== el.defaultChecked : el.tagName === "SELECT" ? el.value !== [...el.options].find((o) => o.defaultSelected)?.value : el.value !== el.defaultValue))
    .map((el) => ({ form: el.form.dataset.form, name: el.name, v: el.value, c: el.checked, cb: el.type === "checkbox" }));
  const a = document.activeElement, focus = a?.form?.dataset?.form && a.name ? { form: a.form.dataset.form, name: a.name, pos: a.selectionStart } : null;
  draw();
  for (const t of typed) {
    const els = document.querySelectorAll(`form[data-form="${cssq(t.form)}"] [name="${cssq(t.name)}"]`);
    els.forEach((el) => { if (t.cb) { if (el.value === t.v) el.checked = t.c; } else el.value = t.v; });
  }
  if (focus) { const el = document.querySelector(`form[data-form="${cssq(focus.form)}"] [name="${cssq(focus.name)}"]`); if (el) { el.focus(); try { if (focus.pos != null) el.setSelectionRange(focus.pos, focus.pos); } catch {} } }
}

/* Every change: apply it on screen right away (same code as the demo), then save it.
   Saves run one at a time in order; if one fails, the screen reloads from the database. */
const ORG = () => DB.org.id;
const upd = (table, id, row) => q(sb.from(table).update(row).eq("id", id));
async function syncAssignments(field, id, ids, other) {
  await q(sb.from("shift_assignments").delete().eq(field, id));
  if (ids.length) await q(sb.from("shift_assignments").insert(ids.map((x) => ({ org_id: ORG(), [field]: id, [other]: x }))));
}
const REMOTE = {
  setStatus: ([id, status]) => okRpc("set_equipment_status", { p_equipment: id, p_status: status }),
  setItemLimits: ([id, mode, hours, ext]) => upd("equipment", id, { time_limit_mode: mode, checkout_hours: hours ?? null, extended_alert_hours: ext ?? null }),
  ackAlert: ([id, note]) => rpc("acknowledge_alert", { p_alert: id, p_notes: note || null }),
  ackReport: ([key, note]) => rpc("acknowledge_shift_report", { p_report: key, p_notes: note || null }),
  revokeStation: ([id]) => rpc("revoke_station", { p_station: id }),
  setActive: ([id, active]) => upd("employees", id, { active }),
  saveSettings: () => { const o = DB.org;
    return upd("organizations", o.id, { name: o.name, logo_url: o.logo_url || null, primary_color: o.primary.toUpperCase(), accent_color: o.accent.toUpperCase(), extended_checkout_hours: o.extended_hours, settings: o.settings }); },
  saveCategory: ([id]) => { const c = catOf(id); if (!c) return;
    return upd("equipment_categories", id, { name: c.name, time_limit_type: c.rule, default_checkout_hours: c.hours, extended_alert_hours: c.extended }); },
  addCategory: async ([d]) => { const c = DB.categories.find((x) => x.name.toLowerCase() === (d.name || "").trim().toLowerCase()); if (!c) return;
    await q(sb.from("equipment_categories").insert({ org_id: ORG(), name: c.name, time_limit_type: c.rule, default_checkout_hours: c.hours, sort_order: c.sort })); },
  deleteCategory: ([id]) => okRpc("delete_category", { p_category: id }),
  setShiftActive: ([id, active]) => upd("shifts", id, { active }),
  saveShift: async ([id, d, crew], r) => {
    const s = DB.shifts.find((x) => x.id === r.id); let sid = id;
    if (can("admin")) {
      const row = { name: s.name, start_time: s.start, end_time: s.end, days_of_week: s.days || null, grace_minutes: s.grace, early_checkout_minutes: s.early };
      if (id) await upd("shifts", id, row); else { sid = (await q(sb.from("shifts").insert({ org_id: ORG(), ...row }).select("id").single())).id; L.idMap[r.id] = sid; s.id = sid; }
    }
    if (crew) await syncAssignments("shift_id", sid, crew, "employee_id");
  },
  saveEquipment: async ([id, d], r) => {
    const x = eqOf(r.id); const row = { category_id: x.cat, name: x.name, nfc_uid: x.tag || null, asset_tag: x.asset || null, notes: x.notes || null };
    if (id) return upd("equipment", id, row);
    const nid = (await q(sb.from("equipment").insert({ org_id: ORG(), ...row }).select("id").single())).id;
    L.idMap[r.id] = nid; x.id = nid; if (S.drawer?.id === r.id) S.drawer.id = nid;
  },
  saveEmployee: async ([id, d], r) => {
    const e = empOf(r.id); const row = { first_name: e.first, last_name: e.last || "", employee_number: e.number || null, badge_uid: e.badge || null };
    let eid = id;
    if (id) await upd("employees", id, row); else { eid = (await q(sb.from("employees").insert({ org_id: ORG(), ...row }).select("id").single())).id; L.idMap[r.id] = eid; e.id = eid; if (S.drawer?.id === r.id) S.drawer.id = eid; }
    await syncAssignments("employee_id", eid, e.shifts || [], "shift_id");
    if (can("admin")) await okRpc("set_employee_station_role", { p_employee: eid, p_role: e.role || "employee", p_pin: d.pin || null });
  },
  invite: async ([email, role, name]) => {
    const r = await okRpc("invite_member", { p_org: ORG(), p_email: email.trim().toLowerCase(), p_role: role });
    const err = await sendInviteEmail(email.trim().toLowerCase(), r.token, name);
    if (err) toast("Invite saved, but the email didn't send: " + err);
  },
  setMemberRole: ([id, role]) => okRpc("set_member_role", { p_org: ORG(), p_user: id, p_role: role }),
  removeMember: ([id]) => okRpc("remove_member", { p_org: ORG(), p_user: id }),
  cancelInvite: ([id]) => rpc("cancel_invite", { p_invite: id }),
};
function goLive() {
  for (const [name, remote] of Object.entries(REMOTE)) {
    const local = api[name];
    api[name] = (...args) => {
      args = args.map((a) => (typeof a === "string" && L.idMap[a]) || a);   // a just-added record's temporary id -> its real id
      const r = local.apply(api, args);
      if (r && r.ok === false) return r;                 // caught on screen; nothing to save
      L.pending++;
      L.queue = L.queue.then(() => new Promise((ok) => setTimeout(ok, 0)))   // let the handler finish its own edits first
        .then(() => remote(args, r))
        .catch((e) => { toast(`Couldn't save: ${niceErr(e)}`); })
        .finally(() => { if (--L.pending === 0) live.reload(); });
      return r;
    };
  }
  // Need the server's answer before showing anything.
  api.createStation = async (name, location) => {
    let loc = null;
    if (location) {
      const found = await q(sb.from("locations").select("id").eq("org_id", ORG()).eq("name", location).limit(1));
      loc = found[0]?.id || (await q(sb.from("locations").insert({ org_id: ORG(), name: location }).select("id").single())).id;
    }
    const r = await rpc("create_station", { p_org: ORG(), p_name: name, p_location: loc });
    if (r.ok === false) throw new Error(r.error === "station_limit" ? `Your plan includes ${r.limit} station${r.limit === 1 ? "" : "s"}. Contact ${SP.support} to add more.` : r.error);
    await live.load(); const s = DB.stations.find((x) => x.id === r.station_id); if (s) s.code = r.activation_code;
    return r.activation_code;
  };
  api.newCode = async (id) => {
    const r = await rpc("reset_station_activation", { p_station: id });
    await live.load(); const s = DB.stations.find((x) => x.id === id); if (s) s.code = r.activation_code;
    return r.activation_code;
  };
  api.shiftReports = () => DB.liveReports || [];
}

/* ---- Sign-in, invites, company choice ---- */
const AUTH = { view: "signin", msg: "", err: "", busy: false, email: "" };
function authCard(inner) {
  return `<div style="grid-column:1 / -1;min-height:100vh;display:grid;place-items:center;padding-block:24px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));background:var(--bg)">
    <div class="panel" style="width:min(420px,100%);padding:26px 24px;display:flex;flex-direction:column;gap:16px">
      <div style="background:#ffffff;border-radius:12px;padding:16px 18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid #e3e8ef">
        <img src="brand/logo.svg" alt="Sonoran Point Technologies" style="width:min(250px,100%);height:auto;display:block"></div>
      ${inner}</div></div>`;
}
function renderAuth() {
  const A = AUTH; let inner;
  const email = esc(L.user?.email || "");
  if (A.view === "loading") inner = `<p class="muted" style="margin:0">${esc(A.msg || "Loading…")}</p>`;
  else if (A.view === "nocompany") inner = `<p style="margin:0">You're signed in as <b>${email}</b>, but this account isn't part of a company yet.</p>
      <p class="muted" style="margin:0;font-size:14px">${A.err ? esc(A.err) + " " : ""}Open the invite email you were sent (it signs you in and adds you), or ask your manager to invite this email address.</p>
      <button class="btn" data-act="signOut">Sign out</button>`;
  else if (A.view === "pick") inner = `<p style="margin:0">Which company?</p><div class="list" style="border:1px solid var(--line);border-radius:10px">
      ${L.companies.map((c) => `<button class="row" data-act="pickOrg" data-id="${c.org_id}" style="grid-template-columns:minmax(0,1fr) auto"><b>${esc(c.name)}</b><span class="muted">${esc(ROLE_NAME[c.role])}</span></button>`).join("")}</div>
      <button class="btn sm" data-act="signOut" style="align-self:flex-start">Sign out</button>`;
  else if (A.view === "welcome" || A.view === "name") inner = `<form data-form="profile" class="fgrid" style="grid-template-columns:1fr">
      <h2 style="margin:0;font-size:20px">${A.view === "welcome" ? `Welcome to ${esc(A.company || "the team")}` : "What's your name?"}</h2>
      <p class="muted" style="margin:0;font-size:14px">${A.view === "welcome" ? "Your name is what your team sees on the dashboard." : "It's shown to your team instead of your email address."}</p>
      <label>Your name<input class="field" name="full_name" autocomplete="name" maxlength="60" required value="${esc(L.user?.user_metadata?.full_name || "")}"></label>
      ${A.view === "welcome" ? `<label>Password<small>Optional. Or keep signing in with an emailed link.</small><input class="field" type="password" name="password" autocomplete="new-password" minlength="8"></label>` : ""}
      <div class="err" role="alert">${esc(A.err)}</div>
      <div class="actions"><button class="btn primary" ${A.busy ? "disabled" : ""}>Continue</button>${A.view === "name" && L.user?.user_metadata?.full_name ? `<button class="btn" type="button" data-act="skipPass">Cancel</button>` : ""}</div></form>`;
  else if (A.view === "newpass") inner = `<form data-form="newpass" class="fgrid" style="grid-template-columns:1fr">
      <h2 style="margin:0;font-size:20px">Set a new password</h2>
      <label>New password<input class="field" type="password" name="password" autocomplete="new-password" minlength="8"></label>
      <div class="err" role="alert">${esc(A.err)}</div>
      <div class="actions"><button class="btn primary" ${A.busy ? "disabled" : ""}>Save password</button></div></form>`;
  else inner = `<form data-form="signin" class="fgrid" style="grid-template-columns:1fr">
      ${A.invite ? `<div class="notice">Sign in with the email address your invite was sent to.</div>` : ""}
      <label>Email<input class="field" type="email" name="email" autocomplete="username" required value="${esc(A.email)}"></label>
      <label>Password<input class="field" type="password" name="password" autocomplete="current-password"></label>
      <div class="err" role="alert">${esc(A.err)}</div>${A.msg ? `<div class="notice">${esc(A.msg)}</div>` : ""}
      <button class="btn primary" style="justify-content:center;padding:10px" ${A.busy ? "disabled" : ""}>Sign in</button>
      <div class="actions" style="justify-content:space-between"><button class="btn sm" type="button" data-act="magic">Email me a sign-in link</button><button class="btn sm" type="button" data-act="forgot">Forgot password?</button></div></form>`;
  $("#app").innerHTML = authCard(inner); renderLayer();
}
async function afterSignIn() {
  L.user = S.session.user; AUTH.view = "loading"; AUTH.msg = ""; renderAuth();
  const invite = sessionStorage.getItem("sp.invite");
  if (invite) {
    sessionStorage.removeItem("sp.invite");
    try {
      const r = await rpc("accept_invite", { p_token: invite });
      if (!r.ok) AUTH.err = { wrong_account: `That invite was sent to ${r.invited_email}. Sign out and open the invite email again.`,
        invite_expired: "That invite has expired. Ask for a new one.", invalid_invite: "That invite link was already used or cancelled." }[r.error] || r.error;
      else { AUTH.joined = r.org_id; }
    } catch (e) { AUTH.err = niceErr(e); }
  }
  try { L.companies = await rpc("my_companies"); } catch (e) { AUTH.view = "signin"; AUTH.err = niceErr(e); return renderAuth(); }
  if (!L.companies.length) { AUTH.view = "nocompany"; return renderAuth(); }
  let pick = AUTH.joined || localStorage.getItem("sp.org");
  if (!L.companies.some((c) => c.org_id === pick)) pick = L.companies.length === 1 ? L.companies[0].org_id : null;
  if (!pick) { AUTH.view = "pick"; return renderAuth(); }
  if (AUTH.joined && !AUTH.passwordAsked) { AUTH.passwordAsked = true; AUTH.company = L.companies.find((c) => c.org_id === pick)?.name; L.org = pick; AUTH.view = "welcome"; return renderAuth(); }
  if (!(L.user.user_metadata?.full_name || "").trim()) { L.org = pick; AUTH.view = "name"; return renderAuth(); }
  return openCompany(pick);
}
async function openCompany(id) {
  L.org = id; try { localStorage.setItem("sp.org", id); } catch {}
  AUTH.view = "loading"; renderAuth();
  try { await live.load(); } catch (e) { AUTH.view = "nocompany"; AUTH.err = niceErr(e); return renderAuth(); }
  S.ready = true; AUTH.err = ""; applyBrand(); render();
  clearInterval(L.timer);
  L.timer = setInterval(() => { if (S.ready && !document.hidden && !S.drawer && !L.pending && !document.activeElement?.matches("input,select,textarea")) live.reload(); }, 30000);
}
async function authAction(kind, form) {
  const A = AUTH; const fd = form ? Object.fromEntries(new FormData(form)) : {}; A.err = ""; A.msg = "";
  const email = (fd.email ?? $('[data-form="signin"] [name=email]')?.value ?? "").trim(); if (email) A.email = email;
  if (kind === "signin") {
    if (!email || !fd.password) { A.err = "Enter your email and password, or use a sign-in link."; return renderAuth(); }
    A.busy = true; renderAuth();
    const { data, error } = await sb.auth.signInWithPassword({ email, password: fd.password }); A.busy = false;
    if (error) { A.err = /invalid/i.test(error.message) ? "That email and password don't match." : error.message; return renderAuth(); }
    S.session = data.session; return afterSignIn();
  }
  if (kind === "magic" || kind === "forgot") {
    if (!email) { A.err = "Enter your email first."; return renderAuth(); }
    const back = location.origin + "/";
    const { error } = kind === "magic" ? await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: back, shouldCreateUser: false } })
      : await sb.auth.resetPasswordForEmail(email, { redirectTo: back });
    if (error) A.err = /signups not allowed|not found/i.test(error.message) ? "There's no account for that email. Ask your manager for an invite." : error.message;
    else A.msg = kind === "magic" ? `Check ${email} for a sign-in link.` : `Check ${email} for a link to set a new password.`;
    return renderAuth();
  }
  if (kind === "profile") {
    const name = (fd.full_name || "").trim().replace(/\s+/g, " ");
    if (!name) { A.err = "Enter your name."; return renderAuth(); }
    if (fd.password && fd.password.length < 8) { A.err = "Passwords need at least 8 characters (or leave it blank)."; return renderAuth(); }
    A.busy = true; renderAuth();
    const { data, error } = await sb.auth.updateUser({ data: { full_name: name }, ...(fd.password ? { password: fd.password } : {}) }); A.busy = false;
    if (error) { A.err = error.message; return renderAuth(); }
    L.user = data.user; if (S.session) S.session.user = data.user;
    toast(fd.password ? "Saved. You can sign in with your password now." : "Saved"); return openCompany(L.org);
  }
  if (kind === "newpass") {
    if ((fd.password || "").length < 8) { A.err = "Use at least 8 characters."; return renderAuth(); }
    A.busy = true; renderAuth(); const { error } = await sb.auth.updateUser({ password: fd.password }); A.busy = false;
    if (error) { A.err = error.message; return renderAuth(); }
    toast("Password saved"); return L.org && A.view === "welcome" ? openCompany(L.org) : afterSignIn();
  }
}
async function bootLive() {
  goLive();
  const inv = new URLSearchParams(location.search).get("invite");
  if (inv) { sessionStorage.setItem("sp.invite", inv); AUTH.invite = true; history.replaceState(null, "", location.pathname + location.hash); }
  sb = window.supabase.createClient(SP.url, SP.key);
  sb.auth.onAuthStateChange((ev, session) => {
    S.session = session;
    if (ev === "PASSWORD_RECOVERY") { AUTH.view = "newpass"; S.ready = false; renderAuth(); }
    if (ev === "SIGNED_OUT") { S.ready = false; clearInterval(L.timer); AUTH.view = "signin"; renderAuth(); }
  });
  const { data } = await sb.auth.getSession(); S.session = data.session;
  if (!S.session) return renderAuth();
  if (AUTH.view !== "newpass") await afterSignIn();
}

function applyBrand() {
  // The dashboard is Sonoran Point's; each company's own color marks their badge at the top of the rail.
  document.documentElement.style.setProperty("--cust", DB.org.accent || "#f7931e");
}
if (LIVE) bootLive(); else { applyBrand(); render(); }
setInterval(() => { if (!S.drawer && !document.activeElement?.matches("input,select,textarea")) render(); }, 60000);  // keep "x min ago" fresh
